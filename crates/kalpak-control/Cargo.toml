[package]
name = "kalpak-control"
description = "Kalpak control plane: Raft-replicated metadata state machine (agents, prefix bindings, block locations)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["raft", "consensus", "distributed", "ai-agents"]
categories = ["database-implementations"]

[dependencies]
bincode = { version = "2", features = ["serde"] }
kalpak-core.workspace = true
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
ed25519-dalek.workspace = true
tempfile.workspace = true
