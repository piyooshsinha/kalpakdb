[package]
name = "kalpak-storage"
description = "Kalpak local storage engine: append-only, content-addressed block segments"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["storage-engine", "kv-cache", "content-addressing", "ai-agents"]
categories = ["database-implementations", "filesystem"]

[dependencies]
kalpak-core.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
moka = { version = "0.12.15", features = ["sync"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }
libc = { version = "0.2", optional = true }

[features]
# Linux-only io_uring backend: batched submission for group commits (all of
# a batch's writes + the fsync go through one ring submission). The default
# backend uses portable positioned I/O so the engine runs everywhere.
uring = ["dep:io-uring", "dep:libc"]
