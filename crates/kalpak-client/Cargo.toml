[package]
name = "kalpak-client"
description = "Rust client SDK for KalpakDB: agent state, KV-cache blocks, prefix manifests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["database", "client", "sdk", "ai-agents", "kv-cache"]
categories = ["database", "api-bindings"]

[dependencies]
kalpak-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
kalpak-proto = { version = "0.6.0", path = "../kalpak-proto", optional = true }
tonic = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true }
ed25519-dalek.workspace = true

[features]
# gRPC streaming data plane client (chunked block streams, group-committed
# server side). Off by default to keep the HTTP-only SDK dependency-light.
grpc = ["dep:kalpak-proto", "dep:tonic", "dep:tokio-stream"]

[dev-dependencies]
kalpakdb = { path = "../kalpakdb" }
tokio = { version = "1", features = ["full"] }
tempfile.workspace = true
ed25519-dalek.workspace = true
