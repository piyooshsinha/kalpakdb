[package]
name = "kalpakdb"
description = "Kalpak node daemon and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["database", "ai-agents", "kv-cache", "raft", "distributed"]
categories = ["database-implementations", "command-line-utilities"]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.11.1"
kalpak-control = { version = "0.1.0", path = "../kalpak-control" }
kalpak-core.workspace = true
kalpak-proto = { version = "0.1.0", path = "../kalpak-proto" }
kalpak-storage = { version = "0.1.0", path = "../kalpak-storage" }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tonic = "0.14"
tower-http = { version = "0.6.11", features = ["cors"] }

[dev-dependencies]
tempfile.workspace = true
