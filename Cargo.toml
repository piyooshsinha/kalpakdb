[workspace]
resolver = "2"
members = [
    "crates/kalpak-core",
    "crates/kalpak-storage",
    "crates/kalpak-client",
    "crates/kalpak-control",
    "crates/kalpak-proto",
    "crates/kalpakdb",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/piyooshsinha/kalpakdb"
rust-version = "1.96"

[workspace.dependencies]
kalpak-core = { version = "0.6.0", path = "crates/kalpak-core" }
kalpak-storage = { version = "0.6.0", path = "crates/kalpak-storage" }
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
