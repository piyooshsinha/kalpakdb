name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kalpakdb:ci .
      - name: Smoke test
        run: |
          docker run -d --name kalpak -p 7411:7411 kalpakdb:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7411/v1/stats && break
            sleep 1
          done
          curl -sf http://127.0.0.1:7411/v1/stats | grep -q control_plane
          ID=$(curl -sf -X POST --data-binary "docker smoke" http://127.0.0.1:7411/v1/blocks | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')
          test "$(curl -sf http://127.0.0.1:7411/v1/blocks/$ID)" = "docker smoke"

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Test io_uring backend (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p kalpak-storage --features uring
      - name: Test gRPC SDK client
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p kalpak-client --features grpc
      - name: Bench (regression visibility, not a gate)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release -p kalpakdb
          ./target/release/kalpakdb bench /tmp --blocks 500 --size-kb 64
      - name: Build node for Python client tests
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p kalpakdb
      - name: Python client tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip3 install --quiet cryptography
          KALPAKDB_BIN=$PWD/target/debug/kalpakdb python3 -m unittest discover -s clients/python/tests
